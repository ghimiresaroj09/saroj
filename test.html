<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob Carousel</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
*,
*::before,
*::after{
    box-sizing:border-box;
}

:root{
    --ease:cubic-bezier(0.29,0.57,0.12,0.99);
    --duration:.6s;
    --size:800px;
    --scaleMask:1;
    --scaleBtn:1;
}

@media(max-width:900px){
    :root{
        --size:600px;
        --scaleMask:.75;
        --scaleBtn:.8;
    }
}

@media(max-width:700px){
    :root{
        --size:400px;
        --scaleMask:.5;
        --scaleBtn:.7;
    }
}

@media(max-width:500px){
    :root{
        --size:300px;
        --scaleMask:.375;
        --scaleBtn:.6;
    }
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    font-family:Roboto,sans-serif;
    color:#84b7b2;
}

.carousel{
    position:relative;
    width:var(--size);
    height:var(--size);
}

.carousel--play{
    position:absolute;
    z-index:10;
    bottom:calc(10% * var(--scaleBtn));
    left:calc(10% * var(--scaleBtn));
    width:120px;
    height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#7ec96a;
    color:#fff;
    text-transform:uppercase;
    cursor:pointer;
    overflow:hidden;
    transform:rotate(-20deg) scale(var(--scaleBtn));
    transition:transform .2s var(--ease);
    box-shadow:0 10px 20px -6px #7ec96a;
}

.carousel--play::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow:inset 0 0 0 10px rgba(255,255,255,.2);
    transform:scale(1.2);
    transition:transform .4s var(--ease);
}

.carousel--play:hover::before{
    transform:scale(1);
}

.carousel--play:active{
    transform:scale(calc(var(--scaleBtn) * .9)) rotate(-5deg);
}

.carousel svg{
    position:absolute;
    width:100%;
    height:100%;
    fill:#e8f5e4;
    pointer-events:none;
}

#mask{
    transform:scale(var(--scaleMask));
}

.carousel--images{
    position:absolute;
    width:100%;
    height:100%;
    clip-path:url(#mask);
    -webkit-clip-path:url(#mask);
    overflow:hidden;
}

.carousel img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:scale(.9);
    transition:
        opacity var(--duration) var(--ease),
        transform var(--duration) var(--ease);
}

.carousel img.active{
    opacity:1;
    transform:scale(1);
}
</style>

</head>

<body>

<div class="carousel">

<svg viewBox="0 0 800 800">
    <defs>
        <clipPath id="mask">
            <path id="path-1"></path>
        </clipPath>
    </defs>

    <path id="path-2"></path>
</svg>

<div class="carousel--images">

<img class="active"
src="https://images.unsplash.com/photo-1595857819837-1c820f33e62d?auto=format&fit=crop&w=1534&q=80">

<img
src="https://images.unsplash.com/photo-1595719078597-f8ba9cc6ae72?auto=format&fit=crop&w=1533&q=80">

<img
src="https://images.unsplash.com/photo-1462804993656-fac4ff489837?auto=format&fit=crop&w=3150&q=80">

</div>

<div class="carousel--play">
Click
</div>

</div>

<script>
class SupahBlob {

    constructor(obj){

        if(!obj.el) return;

        this.el=obj.el;
        this.segments=obj.segments||8;
        this.centerX=obj.centerX||400;
        this.centerY=obj.centerY||400;
        this.minRadius=obj.minRadius||300;
        this.maxRadius=obj.maxRadius||380;
        this.minDuration=obj.minDuration||1;
        this.maxDuration=obj.maxDuration||2;
        this.maskEl=obj.maskEl||null;
        this.maskID=obj.maskID||null;

        this.init();

    }

    init(){

        this.points=[];

        const slice=Math.PI*2/this.segments;

        const tl=gsap.timeline({
            onUpdate:()=>this.update()
        });

        for(let i=0;i<this.segments;i++){

            const angle=slice*i;

            const duration=gsap.utils.random(
                this.minDuration,
                this.maxDuration
            );

            const p={
                x:this.centerX+Math.cos(angle)*this.minRadius,
                y:this.centerY+Math.sin(angle)*this.minRadius
            };

            const tween=gsap.to(p,{
                duration:duration,
                x:this.centerX+Math.cos(angle)*this.maxRadius,
                y:this.centerY+Math.sin(angle)*this.maxRadius,
                ease:"sine.inOut",
                repeat:-1,
                yoyo:true
            });

            tl.add(tween,-duration);

            this.points.push(p);
        }

    }

    update(){

        this.el.setAttribute("d",this.createPath());

        if(this.maskEl){

            this.maskEl.style.clipPath="none";
            this.maskEl.style.webkitClipPath="none";

            this.maskEl.offsetWidth;

            this.maskEl.style.clipPath='url("#mask")';
            this.maskEl.style.webkitClipPath='url("#mask")';

        }

    }

    createPath(){

        const data=this.points;
        const size=data.length;

        let path=`M${data[0].x} ${data[0].y} C`;

        for(let i=0;i<size;i++){

            const p0=data[(i-1+size)%size];
            const p1=data[i];
            const p2=data[(i+1)%size];
            const p3=data[(i+2)%size];

            const x1=p1.x+(p2.x-p0.x)*0.15;
            const y1=p1.y+(p2.y-p0.y)*0.15;

            const x2=p2.x-(p3.x-p1.x)*0.15;
            const y2=p2.y-(p3.y-p1.y)*0.15;

            path+=` ${x1} ${y1} ${x2} ${y2} ${p2.x} ${p2.y}`;

        }

        return path+"z";

    }

}

new SupahBlob({
    el:document.querySelector("#path-1"),
    segments:9,
    centerX:400,
    centerY:400,
    minRadius:300,
    maxRadius:380,
    minDuration:1,
    maxDuration:3,
    maskEl:document.querySelector(".carousel--images"),
    maskID:"#mask"
});

new SupahBlob({
    el:document.querySelector("#path-2"),
    segments:9,
    centerX:400,
    centerY:400,
    minRadius:320,
    maxRadius:400,
    minDuration:2,
    maxDuration:3
});

let active=0;

const slides=document.querySelectorAll(".carousel--images img");

document.querySelector(".carousel--play").addEventListener("click",function(){

    slides[active].classList.remove("active");

    active++;

    if(active>=slides.length){
        active=0;
    }

    slides[active].classList.add("active");

});
</script>

</body>
</html>
